name: Refresh coverage badge

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coverage-master
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - name: Check lockfile registry URLs
        run: |
          if grep -q '__archiveUrl=' yarn.lock; then
            echo "::error file=yarn.lock::yarn.lock pins registry tarball URLs. Run 'sh scripts/sanitize-lockfile.sh' and commit yarn.lock."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pinned Yarn
        run: |
          corepack enable
          corepack install

      - name: Install dependencies
        env:
          HUSKY: '0'
        run: yarn install --immutable

      - name: Run tests and refresh coverage badge
        run: yarn test:coverage

      - name: Commit updated badge
        run: |
          git add .github/media/coverage.svg
          if git diff --cached --quiet; then
            echo "Coverage badge is unchanged."
            exit 0
          fi

          # A newer push gets its own run; never publish coverage for stale code.
          git fetch origin master
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]; then
            echo "Master changed during the test run; the newer run will refresh the badge."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh coverage badge"
          git push origin HEAD:master
