name: Refresh coverage badge

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coverage-master
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - name: Check lockfile registry URLs
        run: |
          if grep -q '__archiveUrl=' yarn.lock; then
            echo "::error file=yarn.lock::yarn.lock pins registry tarball URLs. Run 'sh scripts/sanitize-lockfile.sh' and commit yarn.lock."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pinned Yarn
        run: |
          corepack enable
          corepack install

      - name: Install dependencies
        env:
          HUSKY: '0'
        run: yarn install --immutable

      - name: Run tests and refresh coverage badge
        run: yarn test:coverage

      # Keep generated badges off master, which requires passing PR checks.
      - name: Publish updated badge
        run: |
          # A newer push gets its own run; never publish coverage for stale code.
          git fetch origin master
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]; then
            echo "Master changed during the test run; the newer run will refresh the badge."
            exit 0
          fi

          # Dependency setup can modify tracked files in the test checkout.
          # Publish from a separate worktree so those changes stay isolated.
          badge_dir="$RUNNER_TEMP/coverage-badge"
          if git ls-remote --exit-code --heads origin coverage-badge; then
            git fetch origin coverage-badge
            git worktree add --detach "$badge_dir" FETCH_HEAD
          else
            git worktree add --detach "$badge_dir" HEAD
            git -C "$badge_dir" switch --orphan coverage-badge
          fi
          cp .github/media/coverage.svg "$badge_dir/coverage.svg"
          cp .github/media/coverage.json "$badge_dir/coverage.json"
          git -C "$badge_dir" add coverage.svg coverage.json
          if git -C "$badge_dir" diff --cached --quiet; then
            echo "Coverage badge is unchanged."
            exit 0
          fi

          git -C "$badge_dir" config user.name "github-actions[bot]"
          git -C "$badge_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$badge_dir" commit -m "docs: refresh coverage badge"
          git -C "$badge_dir" push origin HEAD:coverage-badge
