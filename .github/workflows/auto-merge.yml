name: Auto-merge pull requests

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # This privileged workflow only reads PR metadata; it never checks out PR code.
      - name: Enable auto-merge for passing PRs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Query current metadata rather than trusting a possibly stale run payload.
          prs=$(gh api --paginate "repos/$GH_REPO/commits/$HEAD_SHA/pulls" | jq -r '
            .[] | select(
              .state == "open" and .draft == false and
              .base.ref == "master" and .base.repo.full_name == env.GH_REPO and
              .head.sha == env.HEAD_SHA
            ) | .number
          ')

          while IFS= read -r pr; do
            [ -n "$pr" ] || continue
            gh pr merge "$pr" --repo "$GH_REPO" --auto --squash --match-head-commit "$HEAD_SHA"
          done <<< "$prs"
